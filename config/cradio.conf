CONFIG_ZMK_SLEEP=y
# Deep sleep after 30 minutes without keypresses (wake with any key on each half)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000
# Idle state after 60 minutes
CONFIG_ZMK_IDLE_TIMEOUT=3600000
CONFIG_ZMK_MOUSE=y

# Stronger BLE radio for a more reliable link between the halves
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_ZMK_KEYBOARD_NAME="Fer Ferris"
